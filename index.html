<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Genuary Stars — 31 Days</title>

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/gallery.css">
  <link rel="stylesheet" href="css/effects.css">
  <link rel="stylesheet" href="chatbot/chatbot.css">

  <script src="https://unpkg.com/rivescript@latest/dist/rivescript.min.js"></script>
  <script src="chatbot/chatbot.js"></script>
</head>

<body>
  <div id="noiseOverlay" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">✦</div>
      <div class="title">Genuary Stars</div>
    </div>
<nav class="controls day-nav" aria-label="Day navigation">
  <button id="prevDayBtn" class="btn" type="button">← Prev</button>

  <button
    id="dayMenuToggle"
    class="btn day-menu-toggle"
    type="button"
    aria-expanded="false"
    aria-controls="dayMenu"
  >
    <span id="currentDayLabel">Day 01</span>
    <span class="day-menu-caret">▾</span>
  </button>

  <button id="nextDayBtn" class="btn" type="button">Next →</button>

  <div id="dayMenu" class="day-menu hidden" role="menu" aria-label="Choose a day">
    <div id="dayMenuList" class="day-menu-list"></div>
  </div>
</nav>
  </header>

  <main id="scrollStage" class="scroll-stage"></main>

  <button id="chatToggle" class="chat-toggle" type="button" aria-controls="chatPanel" aria-expanded="false">
  ✦ Ask the site
</button>

<section id="chatPanel" class="chat-panel hidden" aria-hidden="true" aria-label="Site chatbot">
  <div class="chat-header">
    <div>
      <div class="chat-title">GenuaryBot</div>
      <div id="chatStatus" class="chat-status">Loading...</div>
    </div>
    <button id="chatClose" class="chat-close" type="button" aria-label="Close chat">×</button>
  </div>

  <div id="chatMessages" class="chat-messages"></div>

  <form id="chatForm" class="chat-form">
    <input
      id="chatInput"
      class="chat-input"
      type="text"
      placeholder="Ask about the site, the code, or a day..."
      autocomplete="off"
    />
    <button class="chat-send" type="submit">Send</button>
  </form>
</section>

    <script src="js/vendor/p5.min.js"></script>

    <!-- v3ga globals depend on p5 globals like abs(), random(), etc -->
    <script src="v3ga/init_trace.js"></script>

    <!-- your app (module) last -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
